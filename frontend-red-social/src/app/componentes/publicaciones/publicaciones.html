<div class="contenedor-feed">
  <nav class="navbar">
    <div class="logo">Socialite</div>
    <div class="enlaces">
      <span *ngIf="usuarioActual">¡Hola, {{ usuarioActual.nombre }}!</span>
      <button class="btn-perfil" routerLink="/mi-perfil">Mi Perfil</button>
    </div>
  </nav>

  <main class="muro">
    
    <div class="caja-crear-post">
      <textarea placeholder="¿Qué estás pensando?"></textarea>
      <button class="btn-primario">Publicar</button>
    </div>

    <div class="post" *ngFor="let post of posteosFalsos">
      <div class="cabecera-post">
        <div class="avatar-generico"></div>
        <div class="info-autor">
          <strong>{{ post.autor }}</strong>
          <span>{{ post.usuario }} • {{ post.fecha }}</span>
        </div>
      </div>
      <div class="contenido-post">
        <p>{{ post.contenido }}</p>
      </div>
      <div class="acciones-post">
        <button>Me gusta</button>
        <button>Comentar</button>
      </div>
    </div>

  </main>
</div>
