<div class="contenedor-feed">
  
  <nav class="navbar">
    <div class="logo">Socialite</div>
    <div class="enlaces">
      <span *ngIf="usuarioActual">¡Hola, {{ usuarioActual.nombreUsuario || usuarioActual.nombre }}!</span>
      <button class="btn-perfil" routerLink="/mi-perfil">Mi Perfil</button>
    </div>
  </nav>

  <div class="muro">
    
    <app-crear-publicacion (postCreado)="agregarNuevoPost($event)"></app-crear-publicacion>
    
    <div class="panel-filtros">
      <button 
        class="btn-filtro" 
        [class.activo]="ordenActual === 'fecha'" 
        (click)="cambiarOrden('fecha')">
        Más Recientes
      </button>
      <button 
        class="btn-filtro" 
        [class.activo]="ordenActual === 'likes'" 
        (click)="cambiarOrden('likes')">
        Más Populares
      </button>
    </div>

    <div class="lista-feed">
      <app-publicacion 
        *ngFor="let post of listaPublicaciones()" 
        [publicacion]="post"
        (posteoBorrado)="quitarPosteoDeLaVista(post._id)">
      </app-publicacion>

      <div *ngIf="listaPublicaciones().length === 0" class="estado-vacio">
        <p>No hay publicaciones para mostrar. ¡Sé el primero en romper el hielo!</p>
      </div>
    </div>

    <button *ngIf="hayMasPublicaciones && listaPublicaciones().length > 0" class="btn-cargar-mas" (click)="cargarFeed()">
      Cargar más posts
    </button>

  </div>
</div>
